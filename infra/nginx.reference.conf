# Reference only. Not included in compose, not validated or applied here.
# Supply certificate files and a real DNS name. Never enable access logs containing tickets.
events { worker_connections 1024; }
http {
 access_log off;
 server_tokens off;
 map $http_upgrade $connection_upgrade { default upgrade; '' close; }
 server {
  listen 443 ssl;
  server_name api.nexus.example;
  ssl_certificate /run/secrets/tls.crt;
  ssl_certificate_key /run/secrets/tls.key;
  ssl_protocols TLSv1.3;
  client_max_body_size 64k;
  add_header Strict-Transport-Security "max-age=31536000" always;
  location / {
   proxy_pass http://api:8080;
   proxy_http_version 1.1;
   proxy_set_header Upgrade $http_upgrade;
   proxy_set_header Connection $connection_upgrade;
   proxy_read_timeout 70s;
  }
 }
}
