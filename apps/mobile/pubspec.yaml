name: nexus_mobile
description: Nexus safety-first dating and city community client.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter: {sdk: flutter}
  flutter_localizations: {sdk: flutter}
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  http: ^1.3.0
  flutter_secure_storage: ^9.2.4
  geolocator: ^13.0.2
  uuid: ^4.5.1
  web_socket_channel: ^3.0.2
dev_dependencies:
  flutter_test: {sdk: flutter}
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
  fonts:
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/NotoSansMyanmar.ttf
